# Dependabot version updates (DEP-09, threat model T12). Keys: docs/research/deploy-github-actions.md §8.
# Weekly, grouped so that one pull request per ecosystem and directory carries the minor and patch bumps;
# majors come one by one. Every update goes through CI like any other pull request (no secrets needed).
version: 2
updates:
  # npm workspaces (shared, relay-server, web-viewer, tools/fake-slicer): one root lockfile
  # (ADR 0007 §1). A merged bump of package*.json redeploys the relay (docs/deploy.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # The Railway IaC SDK (not a workspace).
  - package-ecosystem: npm
    directory: /.railway
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # shared/py (pyproject.toml, PEP 621) and slicer-plugin (requirements-dev.txt, generated by `uv pip compile`
  # from pyproject.toml: regenerate it as slicer-plugin/README.md says when Dependabot bumps the extra).
  - package-ecosystem: pip
    directories: [/shared/py, /slicer-plugin]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  # Pinned `uses:` SHAs in .github/workflows (the `# vX.Y.Z` comment is updated with them).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Base image of relay-server/Dockerfile (node:22-alpine).
  - package-ecosystem: docker
    directory: /relay-server
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Node major versions follow the LTS decision (ADR 0002), not Dependabot.
      - dependency-name: node
        update-types: [version-update:semver-major]
