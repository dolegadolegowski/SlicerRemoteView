# Release on a version tag (DEP-11; docs/deploy.md §8): the Slicer extension zip, the relay image tagged with the
# version, and a draft GitHub Release whose text is the tag's CHANGELOG.md section. The owner reviews the draft,
# attaches the Quest APK by hand (QST-15) and publishes it. Nothing here deploys: Railway deploys from main.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release
      packages: write # push the relay image to GHCR
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Version and release notes from CHANGELOG.md
        id: version
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          node .github/scripts/changelog-section.mjs "$version" > release/notes.md
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command substitution
          printf '\n---\n\n- [ ] APK for Meta Quest: attach `SlicerRemoteView-%s.apk` by hand (QST-15), then publish.\n' \
            "$version" >> release/notes.md

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # SLC-20 provides the packaging script; its output location is `[TODO verify]` with SLC-20.
      - name: Slicer extension zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f slicer-plugin/scripts/package.py ]; then
            echo "::error::slicer-plugin/scripts/package.py (SLC-20) does not exist on this tag"
            exit 1
          fi
          python slicer-plugin/scripts/package.py
          zip="$(find . -path ./node_modules -prune -o -name "SlicerRemoteView-*.zip" -newer CHANGELOG.md -print | head -n 1)"
          [ -n "$zip" ] || { echo "::error::package.py produced no SlicerRemoteView-*.zip"; exit 1; }
          cp "$zip" "release/SlicerRemoteView-${VERSION}.zip"
      # CLAUDE.md rule 6: no local configuration, key or keystore in anything we publish.
      - name: Artefact listing
        run: |
          for zip in release/*.zip; do
            echo "== $zip"
            unzip -Z1 "$zip" | tee release/listing.txt
            if grep -E -i '(^|/)(\.env(\..*)?|\.npmrc)$|\.(pem|key|p12|pfx|keystore|jks)$' release/listing.txt \
              | grep -v -E '(^|/)\.env\.example$'; then
              echo "::error::$zip contains a secret-like file (listed above)"
              exit 1
            fi
          done
          rm release/listing.txt

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name for GHCR
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/slicerremoteview-relay" >> "$GITHUB_OUTPUT"
      - name: Relay image ${{ steps.version.outputs.version }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: relay-server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=relay
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag $prerelease \
            --title "SlicerRemoteView $VERSION" --notes-file release/notes.md release/*.zip
